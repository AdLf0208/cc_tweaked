[package]
# Port of CC: Tweaked 1.121.0 (cc-tweaked/CC-Tweaked, CCPL-1.0), Minecraft Java 1.21.1
# NeoForge, targeting Horizon 26.3 at the pin in horizon-mod.toml. Clean-room Rust
# rewrite from the mod's behaviour (FINDINGS.md); local-only until publishing is
# approved, publishable under CCPL-1.0 with this source.
#
# Cargo's name and version are not the mod's identity: horizon-mod.toml is.
name = "computercraft"
version = "0.2.3"
edition = "2024"
license = "CCPL-1.0"
description = "CC: Tweaked for Horizon: the Computer block and its terminal"
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command
# (the launcher builds against its own copy of the same build). Any other registry
# dependency must be pinned with `horizon-launcher native-lock .` before building.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
