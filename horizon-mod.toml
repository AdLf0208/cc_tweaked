# CC: Tweaked for Horizon — the computer block, its block entity, the terminal it draws
# and the four `/computercraft` usages. One flat package: this manifest is the mod's only
# identity, `src/` is compiled by the launcher against the game build [native] pins, and
# `assets/` + `data/` are the carried content.
id = "computercraft"
name = "CC: Tweaked"
# 0.2.0 is the SDK-format version: it supersedes the retired `.hnmod` 0.1.0 (PR #788,
# closed because Horizon retired `.hnmod`). The registry entry, the file name and the
# release must agree.
version = "0.2.0"
description = """A port of CC: Tweaked for Horizon: the Computer block and a terminal it draws
on its front face. The computer's block entity keeps a program and a 16-column, 10-row
terminal in its saved data, boots the program once when it is powered, and answers four
server commands (`/computercraft load|run|screen|power`) that load a program, run it again,
read the terminal back as one JSON line, and switch the computer on or off. The program
language is a documented Lua 5.2 subset (no tables, functions or coroutines yet); the ROM,
peripherals, turtles and the other block variants are recorded gaps."""
authors = ["Daniel Ratcliffe", "Aaron Mills", "SquidDev", "AdLf0208"]
# The upstream licence, read in full from the jar's manifest URL and carried verbatim as
# LICENSE; LICENSE-NOTICE.md records where every notice was read. Copyleft-style, rank 1:
# publishable under the same licence with this complete source, and local-only until the
# campaign maintainer approves publishing.
api = "0.2"
side = "both"
# registries: "May add blocks, items, mob effects and entity types to your worlds" — the
# computer block and its block entity type.
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0b14f8acfd97fa2c750e42795249dcc981178ca4"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
