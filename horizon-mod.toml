# CC: Tweaked for Horizon — the three computer blocks, the one block entity they share, the
# terminal each draws and the four `/computercraft` usages. One flat package: this manifest is
# the mod's only identity, `src/` is compiled by the launcher against the game build [native]
# pins, and `assets/` + `data/` are the carried content.
id = "computercraft"
name = "CC: Tweaked"
# 0.2.0 was the SDK-format migration (superseding the retired `.hnmod` 0.1.0, PR #788, closed
# because Horizon retired `.hnmod`); 0.2.1 was the registry review's fixes and 0.2.2 is the
# computer block family. The registry entry, the file name and the release must agree.
version = "0.2.3"
description = """A port of CC: Tweaked for Horizon: the three computer blocks (Computer, Advanced Computer
and Command Computer), the terminal each draws on its front face, and the peripheral surface a
running program reaches the world through. A computer's block entity keeps a program and a
16-column, 10-row terminal in its saved data, boots the program once when it is powered, and runs it
in a documented Lua 5.2 subset; a program asks the six blocks beside its computer through
peripheral.getType, peripheral.getNames and peripheral.call over this package's own
computercraft:peripheral capability, and five server commands (/computercraft load|run|screen|power)
load or re-run a program, read the terminal back as one JSON line naming the block it read, and
switch the computer on or off. The probe block computercraft:peripheral_harness answers the key so
the path is provable in game. The ROM, tables/functions/coroutines, monitors, modems, turtles, pocket
computers and the jar's other twelve block types are recorded gaps."""
authors = ["Daniel Ratcliffe", "Aaron Mills", "SquidDev", "AdLf0208"]
# The upstream licence, read in full from the jar's manifest URL and carried verbatim as
# LICENSE; LICENSE-NOTICE.md records where every notice was read. Copyleft-style, rank 1:
# publishable under the same licence with this complete source, and local-only until the
# campaign maintainer approves publishing.
api = "0.2"
side = "both"
# registries: "May add blocks, items, mob effects and entity types to your worlds" — the three
# computer blocks and the block entity type they share.
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0a875da91dbb0fdcb7ba8c42c11341aa229af51a"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
